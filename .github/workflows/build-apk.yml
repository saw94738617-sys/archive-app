name: APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    # 코드를 올리면 '빌드가 되는지'만 확인해요. 서명 · 릴리스 · 폰 알림은 커밋 메시지에 [배포]가 있거나 직접 실행할 때만.
    runs-on: ubuntu-latest
    env:
      DEPLOY: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[배포]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 안드로이드 SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 패키지 설치
        run: |
          npm install --no-audit --no-fund

      - name: 버전 정하기
        id: ver
        run: echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 앱 버전 표시 바꾸기
        run: |
          sed -i 's/window.ARCHIVE_VERSION="0.1"/window.ARCHIVE_VERSION="${{ steps.ver.outputs.name }}";window.ARCHIVE_BUILD=${{ github.run_number }}/' www/index.html
          grep -o 'ARCHIVE_VERSION="[^"]*";window.ARCHIVE_BUILD=[0-9]*' www/index.html

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npm run assets
          npx cap sync android
          cp native/*.java android/app/src/main/java/com/archive/myclothes/
          mkdir -p android/app/src/main/res/drawable && cp native/res/drawable/*.xml android/app/src/main/res/drawable/
          grep -q "androidx.work:work-runtime" android/app/build.gradle || sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.work:work-runtime:2.9.1"/' android/app/build.gradle
          grep -n "work-runtime" android/app/build.gradle
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"/' android/app/build.gradle
          # 푸시 알림(Firebase)
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation platform("com.google.firebase:firebase-bom:33.7.0")\n    implementation "com.google.firebase:firebase-messaging"/' android/app/build.gradle
          if [ -f native/google-services.json ]; then cp native/google-services.json android/app/google-services.json; echo "google-services.json 넣음"; fi
          grep -n "google-services\|firebase" android/app/build.gradle android/build.gradle || true
          printf '\nsubprojects {\n    configurations.all {\n        resolutionStrategy {\n            force "androidx.browser:browser:1.8.0"\n        }\n    }\n}\n' >> android/build.gradle
          tail -8 android/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$M"
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"
          grep -q USE_BIOMETRIC "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' "$M"
          grep -q REQUEST_IGNORE_BATTERY_OPTIMIZATIONS "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>#' "$M"
          grep -n "uses-permission" "$M"
          grep -q UpdatePushService "$M" || sed -i 's#</application>#    <service android:name=".UpdatePushService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>\n    </application>#' "$M"
          grep -n "UpdatePushService" "$M"

      - name: 버전 번호 넣기 (덮어 설치되게)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: APK 빌드
        run: cd android && ./gradlew --no-daemon assembleRelease

      - name: 서명 준비
        if: env.DEPLOY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ARCHIVE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BT=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: 일반 버전 서명
        if: env.DEPLOY == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.ARCHIVE_KEYSTORE_PASS }}
        run: |
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --ks-key-alias archive --out "archive-${{ steps.ver.outputs.name }}.apk" aligned.apk
          rm -f aligned.apk

      - name: 개발자 버전 빌드
        if: env.DEPLOY == 'true'
        run: |
          cp assets-dev/*.png assets/
          npm run assets
          S=android/app/src/main/res/values/strings.xml
          sed -i -E 's#(<string name="(app_name|title_activity_main)">)[^<]*#\1아카이브 개발자#' "$S"
          grep -E "app_name|title_activity_main" "$S"
          F=android/app/src/main/assets/public/index.html
          sed -i 's#<script>window.ARCHIVE_VERSION=#<script>window.ARCHIVE_DEV=true;window.ARCHIVE_VERSION=#' "$F"
          grep -c "ARCHIVE_DEV=true" "$F"
          cd android && ./gradlew --no-daemon assembleRelease

      - name: 개발자 버전 서명
        if: env.DEPLOY == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.ARCHIVE_KEYSTORE_PASS }}
        run: |
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --ks-key-alias archive --out "archive-dev-${{ steps.ver.outputs.name }}.apk" aligned.apk
          "$BT/apksigner" verify "archive-${{ steps.ver.outputs.name }}.apk"
          "$BT/apksigner" verify "archive-dev-${{ steps.ver.outputs.name }}.apk"
          rm -f aligned.apk "$RUNNER_TEMP/release.jks"

      - name: 업데이트 내용 정리
        if: env.DEPLOY == 'true'
        run: |
          git log -1 --pretty=%B | grep -v -E "Co-Authored-By|Claude-Session|^\s*$" > notes.md || true
          printf '\n폰에서 이 페이지를 열고 APK를 눌러 설치하세요. 덮어 설치하면 기록은 그대로 남아요.\n- archive-dev-*.apk : 내 폰용 (개발자 메뉴 있음)\n- archive-*.apk : 일반 버전\n' >> notes.md
          cat notes.md

      - name: 릴리스에 APK 올리기
        if: env.DEPLOY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 아카이브 ${{ steps.ver.outputs.name }}
          body_path: notes.md
          files: |
            archive-dev-${{ steps.ver.outputs.name }}.apk
            archive-${{ steps.ver.outputs.name }}.apk

      - name: Google 인증 (비밀키 없이 GitHub 신원으로)
        if: env.DEPLOY == 'true'
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/628094550104/locations/global/workloadIdentityPools/github/providers/archive-repo
          service_account: firebase-adminsdk-fbsvc@archive-app-515405.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: 폰으로 새 버전 푸시 보내기
        if: env.DEPLOY == 'true' && steps.gauth.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = open("notes.md", encoding="utf-8").read().split("\n\n폰에서")[0].strip()
          msg = {"message": {"topic": "updates", "android": {"priority": "high", "ttl": "86400s"},
                 "data": {"build": "${{ github.run_number }}", "ver": "${{ steps.ver.outputs.name }}", "body": body[:300]}}}
          req = urllib.request.Request("https://fcm.googleapis.com/v1/projects/archive-app-515405/messages:send",
              data=json.dumps(msg).encode(), headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.status, r.read()[:300])
          PY
